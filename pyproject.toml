[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "goonbot"
version = "0.1.0"
description = "Describe the video, get the video. Local semantic search over a tube site's catalogue."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "curl_cffi>=0.7",
    "lxml>=5",
    "numpy>=1.26",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13",
]

[project.scripts]
goonbot = "goonbot.cli:main"

[tool.setuptools]
packages = ["goonbot"]
